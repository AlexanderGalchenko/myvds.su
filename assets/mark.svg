<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" version="1.1">
  <defs>
    <linearGradient id="cyanTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36dff3"/>
      <stop offset="0.55" stop-color="#19b8ea"/>
      <stop offset="1" stop-color="#1b6fee"/>
    </linearGradient>
    <linearGradient id="blueFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28bff1"/>
      <stop offset="0.55" stop-color="#157eea"/>
      <stop offset="1" stop-color="#113ed1"/>
    </linearGradient>
    <linearGradient id="deepBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1967e7"/>
      <stop offset="1" stop-color="#1630c8"/>
    </linearGradient>
    <linearGradient id="rightCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e5f1"/>
      <stop offset="0.55" stop-color="#1bc5ed"/>
      <stop offset="1" stop-color="#1873e8"/>
    </linearGradient>
    <linearGradient id="centerPost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10ace9"/>
      <stop offset="0.55" stop-color="#176be1"/>
      <stop offset="1" stop-color="#1327c0"/>
    </linearGradient>
    <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#87eaff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#42c9ff" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b57c9" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g id="logo" stroke-linejoin="round" stroke-linecap="round">
    <!-- Back/top impossible-cube loop -->
    <polygon points="230,310 610,90 610,265 410,385 230,475" fill="url(#cyanTop)"/>
    <polygon points="610,90 845,225 845,392 610,265" fill="url(#blueFace)"/>
    <polygon points="230,310 410,385 610,510 610,690 230,475" fill="url(#blueFace)"/>

    <!-- Left/bottom loop behind the center post -->
    <polygon points="230,580 410,475 410,780 230,875" fill="url(#deepBlue)"/>
    <polygon points="230,875 410,780 610,895 610,1125" fill="url(#blueFace)"/>

    <!-- Right loop behind the front crossbar -->
    <polygon points="960,290 1115,378 1115,807 960,743" fill="url(#rightCyan)"/>
    <polygon points="765,600 960,488 960,743 765,850" fill="url(#rightCyan)" opacity="0.93"/>
    <polygon points="765,850 960,743 1115,807 890,972" fill="url(#cyanTop)"/>

    <!-- Front diagonal/top bar -->
    <polygon points="610,510 960,290 1115,378 765,600" fill="url(#cyanTop)"/>
    <polygon points="610,510 765,600 765,690 610,694" fill="url(#blueFace)"/>

    <!-- Center/front vertical post -->
    <polygon points="610,694 765,600 765,1038 610,1125" fill="url(#centerPost)"/>
    <polygon points="610,510 765,600 610,694" fill="url(#blueFace)"/>

    <!-- White/transparent negative-space openings are naturally transparent. Edge highlights -->
    <path d="M230 310 L610 510 L960 290" fill="none" stroke="#58dfff" stroke-width="6" opacity="0.6"/>
    <path d="M610 510 L610 694 L765 600" fill="none" stroke="#6de6ff" stroke-width="5" opacity="0.75"/>
    <path d="M960 290 L1115 378 L1115 807" fill="none" stroke="#46d7ef" stroke-width="3" opacity="0.55"/>
    <path d="M610 90 L845 225 L845 392" fill="none" stroke="#35cfff" stroke-width="4" opacity="0.55"/>
    <path d="M230 580 L410 475" fill="none" stroke="#23c3f0" stroke-width="5" opacity="0.6"/>

    <!-- Subtle seam at the central vertical edge -->
    <path d="M610 90 L610 265 M610 510 L610 1125" fill="none" stroke="#0cc9ed" stroke-width="2" opacity="0.45"/>
  </g>
</svg>
